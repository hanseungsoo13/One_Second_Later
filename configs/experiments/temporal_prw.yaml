# Optional analysis, not the main CUCPS evaluation. Set all paths before running.
prw_root: /path/to/PRW-v16.04.20
pairs_root: outputs/example/prw_pairs
output_root: outputs/example/analysis/temporal_prw
prepare:
  train_fraction: 0.8
  annotation_workers: 8
cucps:
  repo: external/CUCPS_official
  args: /path/to/cucps/args.json
  checkpoint: /path/to/cucps/checkpoint.pth
  candidate_mode: detected
  detection_threshold: 0.9
  iou_threshold: 0.5
motion:
  repo: external/dinov3
  weights: /path/to/dinov3_weights.pth
  name: dinov3_vitb16
  checkpoint: /path/to/full_bbox_c/best.pt
  size:
  - 384
  - 640
  person_crop:
    size:
    - 224
    - 224
    scale: 2.0
  heatmap_radius_cells: 1
runtime:
  device: cuda
fit:
  epochs: 20
  learning_rate: 0.03
  temperature: 0.1
  seed: 42
