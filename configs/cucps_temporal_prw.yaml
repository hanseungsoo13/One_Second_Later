prw:
  root: /root/dataset/PersonSearch/PRW-v16.04.20
cucps:
  repo: external/CUCPS_official
temporal_prior:
  # Fixed before PRW evaluation; used only while HNM selects a match for the next frame.
  weight: 0.05
  cache: ../PRW_cucps_temporal/cache/prw_train_e2c_prior.npz
motion:
  repo: external/dinov3
  weights: /root/.cache/torch/hub/checkpoints/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
  name: dinov3_vitb16
  checkpoint: outputs/personpath22-ground-view-e2c-20261119-01/best.pt
  size: [384, 640]
  batch_size: 4
  heatmap_radius_cells: 1
  person_crop:
    size: [224, 224]
    scale: 2.0
training:
  # Official train-prw.sh settings, with the official default seed retained.
  num_pids: 482
  num_cq_size: 500
  lr_decay_step: 14
  batch_size: 4
  workers: 4
  seed: 0
  output_root: ../PRW_cucps_temporal/runs
runtime:
  device: cuda
