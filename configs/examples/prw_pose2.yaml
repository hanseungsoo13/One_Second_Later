# Example paths only: use a separate cache and output location for each experiment.
prw:
  root: /path/to/PRW-v16.04.20
cucps:
  repo: external/CUCPS_official
temporal_prior:
  weight: 0.05
  cache: outputs/example/prw_prior.npz
motion:
  repo: external/dinov3
  weights: /path/to/dinov3_weights.pth
  name: dinov3_vitb16
  pose_checkpoint: /path/to/osl/best.pt
  size:
  - 384
  - 640
  batch_size: 4
  heatmap_radius_cells: 1
  person_crop:
    size:
    - 224
    - 224
    scale: 2.0
  pose:
    model: https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/rtmpose-m_simcc-body7_pt-body7_420e-256x192-e48f03d0_20230504.zip
    input_size:
    - 192
    - 256
    backend: onnxruntime
    device: cuda
training:
  num_pids: 482
  num_cq_size: 500
  lr_decay_step: 14
  batch_size: 4
  workers: 4
  seed: 0
  epochs: 25
  output_root: outputs/example/cucps_runs
runtime:
  device: cuda
